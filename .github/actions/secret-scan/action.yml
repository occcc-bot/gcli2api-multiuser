name: Scan committed history for secrets
description: Run checksum-pinned Gitleaks with exact dummy-example exceptions
runs:
  using: composite
  steps:
    - name: Install and run Gitleaks
      shell: bash
      run: |
        set -euo pipefail
        scan_dir="$(mktemp -d)"
        trap 'rm -rf "$scan_dir"' EXIT
        curl --fail --silent --show-error --location \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$scan_dir/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum --check --status
        tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
        "$scan_dir/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner
        # git log -p can omit a merge commit's diff; scan its complete tree too.
        mkdir "$scan_dir/tree"
        git archive HEAD | tar -x -C "$scan_dir/tree"
        "$scan_dir/gitleaks" dir "$scan_dir/tree" \
          --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact=100 --no-banner
