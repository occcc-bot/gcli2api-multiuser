name: Multiuser tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/secret-scan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_member_quota_ui.mjs
      - run: python -m compileall -q src scripts web.py config.py
